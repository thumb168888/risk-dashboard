<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
  <title id="title">牧羊人市場觀察頁示意</title>
  <desc id="desc">左側更新控制，右側期交所比率與六張跨市場指標卡；全部數值為佔位符。</desc>
  <rect width="1000" height="550" rx="16" fill="#101827"/>
